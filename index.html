<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FM Trade Terminal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #0a0708;
    --panel: #150f10;
    --panel-2: #1d1416;
    --line: #2e1b1e;
    --gold-1: #e8352f;
    --gold-2: #8f1712;
    --text: #ece7e6;
    --text-dim: #93807f;
    --buy: #3ecf7e;
    --sell: #e8352f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  .wrap{ max-width:480px; margin:0 auto; padding:16px 16px 32px; }

  .brand{ display:flex; align-items:center; justify-content:space-between; padding:8px 2px 18px; }
  .brand-name{ font-size:20px; font-weight:800; letter-spacing:0.5px;
    background:linear-gradient(120deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand-tag{ font-size:11px; color:var(--text-dim); border:1px solid var(--line);
    padding:4px 10px; border-radius:20px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; }

  .seg{ display:flex; background:var(--panel-2); border-radius:14px; padding:4px; margin-bottom:18px; }
  .seg button{ flex:1; padding:11px 0; border:none; border-radius:11px; background:transparent;
    color:var(--text-dim); font-size:14px; font-weight:700; letter-spacing:0.3px; cursor:pointer;
    transition:all .2s ease; }
  .seg button.active{ background:linear-gradient(120deg, var(--gold-1), var(--gold-2)); color:#161208; }

  label.field-label{ display:block; font-size:11px; letter-spacing:1px; color:var(--text-dim);
    text-transform:uppercase; margin:14px 2px 8px; }

  select.pair-select{ width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); font-size:16px; font-weight:600; padding:14px 16px; border-radius:12px;
    appearance:none; -webkit-appearance:none; }

  .tf-row{ display:flex; gap:8px; }
  .tf-row button{ flex:1; padding:12px 0; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer; }
  .tf-row button.active{ border-color:var(--gold-1); color:var(--gold-1); background:rgba(245,196,81,0.08); }

  .price-row{ display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-top:16px; }
  .price-left{ display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12px; letter-spacing:0.5px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--buy); box-shadow:0 0 8px var(--buy); }
  .price-val{ font-size:19px; font-weight:700; color:var(--gold-1); }

  .btn{ width:100%; border:none; border-radius:14px; padding:16px 0; font-size:15px; font-weight:800;
    letter-spacing:0.3px; cursor:pointer; margin-top:16px; }
  .btn-primary{ background:linear-gradient(120deg, var(--gold-1), var(--gold-2)); color:#161208; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-secondary{ background:transparent; border:1px solid var(--gold-2); color:var(--gold-1); }

  .or-div{ display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-dim); font-size:11px; }
  .or-div::before, .or-div::after{ content:""; flex:1; height:1px; background:var(--line); }

  .result{ margin-top:18px; border-radius:16px; padding:18px; display:none; }
  .result.show{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .result.buy{ background:rgba(62,207,126,0.10); border:1px solid rgba(62,207,126,0.35); }
  .result.sell{ background:rgba(226,85,79,0.10); border:1px solid rgba(226,85,79,0.35); }
  .res-dir{ font-size:26px; font-weight:900; letter-spacing:1px; }
  .result.buy .res-dir{ color:var(--buy); }
  .result.sell .res-dir{ color:var(--sell); }
  .res-meta{ margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px; }
  .res-meta div span{ display:block; color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
  .strength{ margin-top:12px; display:flex; gap:4px; }
  .strength i{ flex:1; height:5px; border-radius:3px; background:var(--line); }
  .strength i.on{ background:var(--gold-1); }

  .confidence-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .confidence-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .confidence-badge{ font-size:15px; font-weight:900; padding:3px 12px; border-radius:20px; }
  .confidence-badge.high{ background:rgba(62,207,126,0.18); color:#3ecf7e; }
  .confidence-badge.mid{ background:rgba(232,196,45,0.18); color:#e8c42d; }
  .confidence-badge.low{ background:rgba(147,128,127,0.18); color:var(--text-dim); }

  .reasons-row{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .reason-tag{ font-size:10px; font-weight:700; padding:4px 9px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); letter-spacing:0.3px; }

  .suggested-exp{ margin-top:14px; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(120deg, rgba(232,53,47,0.12), rgba(143,23,18,0.12));
    border:1px solid var(--gold-2); border-radius:12px; padding:12px 14px; }
  .suggested-exp .lbl{ font-size:11px; color:var(--text-dim); }
  .suggested-exp .val{ font-size:18px; font-weight:900; color:var(--gold-1); }

  .chart-box{ margin-top:16px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    height:280px; display:none; background:var(--panel-2); }
  .chart-box.show{ display:block; }
  .chart-note{ font-size:10px; color:var(--text-dim); text-align:center; margin-top:6px; }

  .result-buttons{ display:flex; gap:10px; margin-top:16px; }
  .result-buttons button{ flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); font-size:14px; font-weight:800; cursor:pointer; }
  .btn-win{ color:var(--buy); }
  .btn-win.marked{ background:rgba(62,207,126,0.18); border-color:var(--buy); }
  .btn-loss{ color:var(--sell); }
  .btn-loss.marked{ background:rgba(232,84,79,0.18); border-color:var(--sell); }

  .stats-view{ display:none; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .stats-view.show{ display:block; }
  .card.hide-card{ display:none; }
  .stats-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; }
  .stats-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 10px; text-align:center; }
  .stats-card .val{ font-size:22px; font-weight:900; }
  .stats-card .lbl{ font-size:10px; color:var(--text-dim); text-transform:uppercase; margin-top:4px; letter-spacing:0.5px; }
  .stats-card.win .val{ color:var(--buy); }
  .stats-card.loss .val{ color:var(--sell); }
  .stats-card.rate .val{ color:var(--gold-1); }

  .history-item{ display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line); }
  .history-item:last-child{ border-bottom:none; }
  .history-left{ display:flex; flex-direction:column; gap:2px; }
  .history-pair{ font-size:13px; font-weight:700; }
  .history-time{ font-size:10px; color:var(--text-dim); }
  .history-dir{ font-size:12px; font-weight:800; padding:3px 9px; border-radius:8px; }
  .history-dir.buy{ background:rgba(62,207,126,0.15); color:var(--buy); }
  .history-dir.sell{ background:rgba(232,84,79,0.15); color:var(--sell); }
  .history-conf{ font-size:11px; color:var(--gold-1); font-weight:700; margin-left:8px; }
  .history-empty{ text-align:center; color:var(--text-dim); font-size:12px; padding:20px 0; }

  .status{ text-align:center; font-size:12px; color:var(--text-dim); margin-top:14px; min-height:16px; }

  .nav{ display:flex; justify-content:space-around; margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
  .nav div{ text-align:center; font-size:11px; color:var(--text-dim); }
  .nav div.active{ color:var(--gold-1); }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-name">FM TRADE</div>
    <div class="brand-tag" id="modeTag">СИГНАЛИ</div>
  </div>

  <div class="card" id="card">
    <div class="seg">
      <button class="active" data-mode="FOREX" onclick="setMode('FOREX')">FOREX</button>
      <button data-mode="OTC" onclick="setMode('OTC')">OTC</button>
      <button data-mode="STOCKS" onclick="setMode('STOCKS')">STOCKS</button>
    </div>

    <label class="field-label">Торгова пара</label>
    <select class="pair-select" id="pairSelect"></select>

    <label class="field-label">Експірація</label>
    <div class="tf-row" id="tfRow">
      <button data-tf="1" class="active" onclick="setTF('1', this)">1 хв</button>
      <button data-tf="2" onclick="setTF('2', this)">2 хв</button>
      <button data-tf="3" onclick="setTF('3', this)">3 хв</button>
      <button data-tf="5" onclick="setTF('5', this)">5 хв</button>
    </div>
    <div class="tf-row" style="margin-top:8px;">
      <button data-tf="10" onclick="setTF('10', this)">10 хв</button>
      <button data-tf="15" onclick="setTF('15', this)">15 хв</button>
    </div>

    <div class="price-row">
      <div class="price-left"><span class="dot"></span> ПОТОЧНА ЦІНА</div>
      <div class="price-val" id="priceVal">—</div>
    </div>

    <button class="btn btn-primary" onclick="getSignal(false)">⚡ Отримати сигнал</button>
    <div class="or-div">АБО</div>
    <button class="btn btn-secondary" onclick="getSignal(true)">✦ Автосигнал</button>

    <div class="result" id="result">
      <div class="res-dir" id="resDir">BUY</div>
      <div class="res-meta">
        <div><span>Пара</span><b id="resPair">—</b></div>
        <div><span>Експірація</span><b id="resExp">—</b></div>
        <div><span>Тренд 5М</span><b id="resTrend">—</b></div>
        <div><span>Час</span><b id="resTime">—</b></div>
      </div>
      <div class="strength" id="resStrength"></div>
      <div class="confidence-row">
        <div class="confidence-label">Впевненість</div>
        <div class="confidence-badge" id="resConfidence">—</div>
      </div>
      <div class="reasons-row" id="resReasons"></div>
      <div class="suggested-exp" id="suggestedExp" style="display:none;">
        <div class="lbl">🎯 Бот рекомендує експірацію</div>
        <div class="val" id="suggestedExpVal">—</div>
      </div>
      <div class="chart-box" id="chartBox"></div>
      <div class="chart-note" id="chartNote"></div>
      <div class="result-buttons">
        <button class="btn-win" id="btnWin" onclick="markResult('win')">✅ Плюс</button>
        <button class="btn-loss" id="btnLoss" onclick="markResult('loss')">❌ Мінус</button>
      </div>
    </div>

    <div class="stats-view" id="statsView">
      <div class="stats-grid">
        <div class="stats-card win"><div class="val" id="statWins">0</div><div class="lbl">Плюси</div></div>
        <div class="stats-card loss"><div class="val" id="statLosses">0</div><div class="lbl">Мінуси</div></div>
        <div class="stats-card rate"><div class="val" id="statRate">0%</div><div class="lbl">Вінрейт</div></div>
      </div>
      <label class="field-label" style="margin-top:20px;">Останні сигнали</label>
      <div id="historyList"></div>
    </div>

    <div class="status" id="statusMsg"></div>
  </div>

  <div class="nav">
    <div class="active" id="navPanel" onclick="showPanel()">Панель</div>
    <div id="navStats" onclick="showStats()">Статистика</div>
  </div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_BASE = "https://web-production-acfff.up.railway.app";

const PAIRS = {
  FOREX: ["EUR/USD","GBP/USD","USD/JPY","USD/CHF","USD/CAD","AUD/USD","NZD/USD","EUR/GBP","EUR/JPY","EUR/CHF","EUR/CAD","EUR/AUD","EUR/NZD","GBP/JPY","GBP/CHF","GBP/CAD","GBP/AUD","GBP/NZD","CHF/JPY","CAD/JPY","AUD/JPY","NZD/JPY","AUD/CHF","CAD/CHF","NZD/CHF","AUD/CAD","NZD/CAD","AUD/NZD"],
  OTC:   ["EUR/USD OTC","GBP/USD OTC","USD/JPY OTC","AUD/CAD OTC","NZD/USD OTC","EUR/JPY OTC","USD/CHF OTC","EUR/GBP OTC","AUD/USD OTC","USD/CAD OTC","GBP/JPY OTC","EUR/CAD OTC","AUD/JPY OTC","NZD/JPY OTC","USD/TRY OTC","EUR/TRY OTC","USD/ZAR OTC","USD/BDT OTC","USD/PKR OTC","USD/INR OTC","USD/EGP OTC"],
  STOCKS: ["Apple OTC","Tesla OTC","Nvidia OTC","Amazon OTC","Microsoft OTC","Google OTC","Intel OTC","Palantir OTC"]
};

let mode = "FOREX";
let tf = "1";

function apiMode(m){
  return m === "FOREX" ? "LIVE" : m;
}

function setMode(m){
  mode = m;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  document.getElementById('modeTag').textContent = m === "OTC" ? "OTC СИГНАЛИ" : m === "STOCKS" ? "АКЦІЇ (OTC)" : "FOREX СИГНАЛИ";
  fillPairs();
  hideResult();
}

function setTF(v, el){
  tf = v;
  document.querySelectorAll('.tf-row button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function fillPairs(){
  const sel = document.getElementById('pairSelect');
  sel.innerHTML = "";
  PAIRS[mode].forEach(p=>{
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
  updatePrice();
}

function updatePrice(){
  const base = 1.0500 + Math.random()*0.15;
  document.getElementById('priceVal').textContent = base.toFixed(5);
}

function hideResult(){
  document.getElementById('result').classList.remove('show','buy','sell');
}

async function getSignal(auto){
  const statusEl = document.getElementById('statusMsg');
  const pair = document.getElementById('pairSelect').value;
  const queryPair = pair.replace(" OTC", "");
  statusEl.textContent = "Аналізуємо ринок...";
  hideResult();

  try{
    const url = `${API_BASE}/api/signal?pair=${encodeURIComponent(queryPair)}&mode=${apiMode(mode)}&expiration=${tf}&auto=${auto}`;
    const res = await fetch(url);

    if(res.status === 404){
      statusEl.textContent = "Ще немає сигналу по цій парі — спробуй пізніше або іншу пару";
      return;
    }
    if(!res.ok) throw new Error("backend error");

    const data = await res.json();
    renderSignal(data);
    statusEl.textContent = "";
  }catch(e){
    renderSignal(demoSignal(pair, auto));
    statusEl.textContent = "⚠ Демо-режим: бекенд недоступний";
  }
}

function demoSignal(pair, auto){
  const dir = Math.random() > 0.5 ? "BUY" : "SELL";
  const demoReasons = ["OB","FVG","RSI","MACD","Breaker"];
  const pickedReasons = demoReasons.filter(()=>Math.random() > 0.5);
  const conf = 60 + Math.floor(Math.random()*40);
  const suggExp = conf >= 90 ? "1" : conf >= 80 ? "2" : conf >= 70 ? "3" : conf >= 50 ? "5" : "10";
  return {
    direction: dir,
    pair: auto ? PAIRS[mode][Math.floor(Math.random()*PAIRS[mode].length)] : pair,
    expiration: tf,
    trend: dir === "BUY" ? "Висхідний" : "Низхідний",
    strength: Math.ceil(Math.random()*4),
    confidence: conf,
    reasons: (pickedReasons.length ? pickedReasons : ["Structure"]).join(", "),
    suggested_expiration: suggExp
  };
}

let lastSignal = null;

function markResult(result){
  if(!lastSignal) return;
  const queryPair = (lastSignal.pair || "").replace(" OTC", "");
  fetch(`${API_BASE}/api/result`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pair: queryPair,
      mode: apiMode(mode),
      direction: lastSignal.direction,
      result: result
    })
  }).catch(()=>{});

  document.getElementById('btnWin').classList.toggle('marked', result === 'win');
  document.getElementById('btnLoss').classList.toggle('marked', result === 'loss');
}
function showPanel(){
  document.getElementById('statsView').classList.remove('show');
  document.getElementById('card').classList.remove('hide-card');
  document.getElementById('navPanel').classList.add('active');
  document.getElementById('navStats').classList.remove('active');
}

function showStats(){
  document.getElementById('statsView').classList.add('show');
  document.getElementById('card').classList.add('hide-card');
  document.getElementById('navStats').classList.add('active');
  document.getElementById('navPanel').classList.remove('active');
  loadStats();
}

function loadStats(){
  fetch(`${API_BASE}/api/stats`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('statWins').textContent = data.wins;
      document.getElementById('statLosses').textContent = data.losses;
      document.getElementById('statRate').textContent = data.winrate + "%";
    })
    .catch(()=>{});

  fetch(`${API_BASE}/api/history?limit=20`)
    .then(r => r.json())
    .then(list => {
      const el = document.getElementById('historyList');
      if(!list || list.length === 0){
        el.innerHTML = '<div class="history-empty">Ще немає сигналів в історії</div>';
        return;
      }
      el.innerHTML = "";
      list.forEach(item=>{
        const row = document.createElement('div');
        row.className = "history-item";
        const time = new Date(item.ts * 1000).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
        row.innerHTML = `
          <div class="history-left">
            <div class="history-pair">${item.pair}</div>
            <div class="history-time">${time} · ${item.mode}</div>
          </div>
          <div>
            <span class="history-dir ${item.direction === 'BUY' ? 'buy' : 'sell'}">${item.direction}</span>
            <span class="history-conf">${item.confidence != null ? item.confidence + '%' : ''}</span>
          </div>
        `;
        el.appendChild(row);
      });
    })
    .catch(()=>{
      document.getElementById('historyList').innerHTML = '<div class="history-empty">Не вдалось завантажити історію</div>';
    });
}

function toTVSymbol(pair, m){
  const clean = pair.replace(" OTC", "");
  if(m === "STOCKS"){
    const stockMap = {
      "Apple":"NASDAQ:AAPL", "Tesla":"NASDAQ:TSLA", "Nvidia":"NASDAQ:NVDA",
      "Amazon":"NASDAQ:AMZN", "Microsoft":"NASDAQ:MSFT", "Google":"NASDAQ:GOOGL",
      "Intel":"NASDAQ:INTC", "Palantir":"NYSE:PLTR"
    };
    return stockMap[clean] || "NASDAQ:AAPL";
  }
  const fx = clean.replace("/", "");
  return "FX:" + fx;
}

function tfToInterval(t){
  const map = {"1":"1","2":"1","3":"1","5":"5","10":"5","15":"15"};
  return map[t] || "1";
}

function showChart(pair, m, tfVal){
  const box = document.getElementById('chartBox');
  const noteEl = document.getElementById('chartNote');

  if(m !== "FOREX"){
    box.classList.remove('show');
    box.innerHTML = "";
    noteEl.textContent = "Графік недоступний для OTC/акцій — котирування Pocket Option синтетичні й не збігаються з реальним ринком";
    return;
  }

  const symbol = toTVSymbol(pair, m);
  const interval = tfToInterval(tfVal);
  const cfg = {
    autosize: true,
    symbol: symbol,
    interval: interval,
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "uk",
    toolbar_bg: "#150f10",
    hide_top_toolbar: true,
    hide_legend: false,
    save_image: false,
    backgroundColor: "#150f10",
    gridColor: "rgba(46,27,30,0.6)",
    allow_symbol_change: false
  };
  const src = "https://s.tradingview.com/embed-widget/advanced-chart/?locale=uk#" + encodeURIComponent(JSON.stringify(cfg));
  box.innerHTML = `<iframe src="${src}" style="width:100%;height:100%;border:0;" allowtransparency="true"></iframe>`;
  box.classList.add('show');
  noteEl.textContent = "";
}

function renderSignal(data){
  lastSignal = data;
  document.getElementById('btnWin').classList.remove('marked');
  document.getElementById('btnLoss').classList.remove('marked');

  const box = document.getElementById('result');
  box.classList.add('show', data.direction === "BUY" ? "buy" : "sell");
  document.getElementById('resDir').textContent = data.direction === "BUY" ? "▲ BUY" : "▼ SELL";
  document.getElementById('resPair').textContent = data.pair;
  document.getElementById('resExp').textContent = data.expiration + " хв";
  document.getElementById('resTrend').textContent = data.trend || "—";
  document.getElementById('resTime').textContent = data.age_minutes != null
    ? (data.age_minutes <= 0 ? "щойно" : data.age_minutes + " хв тому")
    : new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});

  const strengthEl = document.getElementById('resStrength');
  strengthEl.innerHTML = "";
  for(let i=0;i<4;i++){
    const bar = document.createElement('i');
    if(i < (data.strength||3)) bar.classList.add('on');
    strengthEl.appendChild(bar);
  }

  const conf = data.confidence != null ? data.confidence : 70;
  const confEl = document.getElementById('resConfidence');
  confEl.textContent = conf + "%";
  confEl.className = "confidence-badge " + (conf >= 90 ? "high" : conf >= 70 ? "mid" : "low");

  const reasonsEl = document.getElementById('resReasons');
  reasonsEl.innerHTML = "";
  const reasonsList = (data.reasons || "").split(",").map(r=>r.trim()).filter(Boolean);
  reasonsList.forEach(r=>{
    const tag = document.createElement('span');
    tag.className = "reason-tag";
    tag.textContent = r;
    reasonsEl.appendChild(tag);
  });

  const suggBox = document.getElementById('suggestedExp');
  if(data.suggested_expiration){
    suggBox.style.display = "flex";
    document.getElementById('suggestedExpVal').textContent = data.suggested_expiration + " хв";
  } else {
    suggBox.style.display = "none";
  }

  showChart(data.pair, mode, tf);
}

fillPairs();
setInterval(updatePrice, 4000);
</script>
</body>
</html>
